name: Fetch Exchange Rates (Korea Eximbank)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '시험 실행 (커밋·푸시·알림 트리거 안 함)'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-fetch-naver]

concurrency:
  group: fetch-exchange-rates-naver
  cancel-in-progress: true

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0
      
    - name: Create data directories
      run: mkdir -p data/history data/daily
      
    - name: Fetch and Process
      env:
        KOREAEXIM_API_KEY: ${{ secrets.KOREA_EXIM_API_KEY }}
      run: |
        # 2026-11-12부터 네이버 내부 주소가 GitHub 서버 요청을 거부해 한국수출입은행 공식 API로 옮겼다.
        # 영업일 하루 1회 고시. 이미 받은 날은 API를 부르지 않고 파일도 바꾸지 않는다.
        node c/scripts/fetch-koreaexim.cjs

        # 형식 검증
        if ! jq . data/exchange-rates.json > /dev/null; then
          echo "❌ Invalid JSON generated!"
          exit 1
        fi

        # Scripts
        node c/scripts/consolidate-exchange-rates.cjs || echo "Consolidate failed"
        node c/scripts/build-chart-history.cjs || echo "Chart history failed"
        node c/scripts/generate-intraday.cjs || echo "Intraday failed"
        node c/scripts/fetch-news.js || echo "News failed"
        
    - name: Dry run summary
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      run: |
        echo "=== 시험 실행: 커밋하지 않음 ==="
        jq -c '.[0]' data/exchange-rates.json
        jq -r '.[1:][] | "\(.cur_unit) \(.deal_bas_r)"' data/exchange-rates.json | head -25
        git status --short data | head -20

    - name: Commit and Push
      if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add -A
        
        if git diff --staged --quiet; then
          echo "No changes detected."
        else
          COMMIT_TIME=$(date '+%Y-%m-%d %H:%M:%S KST')
          git commit -m "data: [LIVE-SYNC] Exchange rates update ($COMMIT_TIME) - Synced to History & Daily"
          
          PUSHED=false
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "✅ Success: Data pushed."
              PUSHED=true
              break
            fi
            sleep 5
          done
          
          if [ "$PUSHED" = true ]; then
            echo "🚀 Triggering Site Deployment (Alert trigger disabled by user)..."
            TOKEN="${{ secrets.TRIGGER_TOKEN }}"
            if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
            
            # 1. 사이트 배포 트리거
            curl -X POST -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-dollar-investment.yml/dispatches" \
              -d '{"ref":"main"}' || true

            # 2. 환율 급변동 및 사용자 알림 트리거 (활성화됨)
            curl -X POST -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"trigger-fx-alert"}' || true
          fi
        fi
